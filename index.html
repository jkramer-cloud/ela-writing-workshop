    .writing-area{min-height:145px;font-size:16px;line-height:1.65;background:#fffdf9;padding:18px;font-family:Georgia,"Times New Roman",serif}.wordcount{font-size:12px;color:#72837c}.writing-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 16px}.hint-card{border-radius:12px;padding:15px;background:#fff8e8;border:1px solid #f0e0b2}.hint-card h4{color:#735b23;margin-bottom:6px}.hint-card p{margin:0;font-size:13px;color:#705e35}.hint-card + .hint-card{margin-top:9px}.tip-list{display:grid;gap:9px;margin:0;padding-left:19px}.tip-list li{padding-left:4px}
    .coach{display:grid;gap:15px}.coach-box{padding:19px}.coach-header{display:flex;gap:10px;align-items:center;margin-bottom:12px}.coach-avatar{height:38px;width:38px;border-radius:13px;background:#e6f4e8;color:#1b6b61;display:grid;place-items:center;font-size:23px}.coach-header h3{font-size:17px}.check-list{display:grid;gap:9px}.check-item{display:flex;gap:9px;align-items:flex-start;color:#485d5f;font-size:12.5px}.check-symbol{flex:0 0 19px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:850;margin-top:1px;background:#fff0dd;color:#926a33}.check-item.ok .check-symbol{color:#fff;background:#238364}.check-item.neutral .check-symbol{color:#617971;background:#edf2ed}.callout{background:#f0f7f5;border-left:3px solid #479a83;padding:12px 13px;border-radius:5px 10px 10px 5px;font-size:12px;color:#406260}.coach-story{background:linear-gradient(130deg,#294d52,#204146);border-radius:13px;color:#fff;padding:17px}.coach-story p{font-size:13px;color:#d9e9e7}.coach-story .btn{background:#fff;color:#284546;border-color:#fff}
    .review-block{padding:19px;border-radius:14px;border:1px solid #e0e7db;background:#fafbf8}.review-block h3{font-size:17px;margin:0 0 7px}.essay-preview{font:16px/1.8 Georgia,"Times New Roman",serif;white-space:pre-wrap;word-break:break-word;background:#fffdf7;color:#2e3937;border:1px solid #e5e3d5;padding:23px 24px;border-radius:12px;min-height:120px}.essay-preview.placeholder{color:#8e948d;font-style:italic}.check-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{padding:14px 10px;background:#f4f7f1;border-radius:12px;text-align:center}.metric strong{font-size:26px;display:block;line-height:1.15}.metric small{font-size:11px;color:#6e8079;font-weight:700}.note{font-size:12px;color:#677978;background:#f4f6f4;border:1px solid #e0e6df;padding:12px;border-radius:10px}
    .draft-list{display:grid;gap:7px}.draft-item{padding:11px;border-radius:10px;border:1px solid #dde8df;background:#fbfcfa;display:flex;align-items:center;gap:9px}.draft-item button{flex:1;background:transparent;border:0;color:#233e3f;text-align:left;padding:0}.draft-item strong{display:block;font-size:13px}.draft-item small{display:block;font-size:11px;color:#72827e}.draft-item.active{border-color:#72b09b;background:#eef8f2}
    .quickquestion{font-size:17px;font-weight:750;padding:22px;background:#f3f7f1;border-radius:14px;border:1px solid #dfebdf;margin:10px 0}.quiz-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quiz-options button{border:1px solid #c9dcd3;padding:12px;border-radius:12px;background:#fff;color:#204b48;font-weight:800;text-align:left}.quiz-options button:hover{border-color:#398a75;background:#ecf8f1}.quiz-options button:disabled{cursor:default}.quiz-result{padding:12px 15px;border-radius:10px;margin:14px 0 0;font-size:13px;background:#fff4db;color:#715d29}.quiz-result.good{background:#e5f5e9;color:#206343}
    .toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:#17373b;color:#fff;padding:12px 20px;border-radius:12px;box-shadow:0 14px 32px #182d3255;z-index:30;transition:transform .25s ease;max-width:min(90vw,490px);text-align:center;font-weight:700;font-size:13px}.toast.show{transform:translate(-50%,0)}
    .footnote{text-align:center;font-size:11px;color:#81908b;max-width:1500px;margin:0 auto;padding:0 25px 25px}.mini-preview{border:1px solid #dfe7dc;border-radius:11px;padding:14px;background:#fcfdf9}.mini-preview p{margin:0;font:13px/1.65 Georgia,serif;color:#485952}.caption{font-size:11px;color:#718079}.fade-in{animation:fade .28s ease both}@keyframes fade{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.empty{text-align:center;padding:25px;background:#f8f9f5;border:1px dashed #ccd5cc;border-radius:14px;color:#617471}
    @media(max-width:1260px){.layout{grid-template-columns:220px minmax(0,1fr);gap:15px}.sidebar{top:93px}.coach{position:static;grid-column:2;grid-row:auto;grid-template-columns:1fr 1fr}.coach-box{min-width:0}.layout.simple{grid-template-columns:220px minmax(0,1fr)}}
    @media(max-width:830px){.topbar{padding:12px 17px;position:static}.top-link{font-size:12px;padding:7px 9px}.brand small{display:none}.brand strong{font-size:15px}.layout,.layout.simple{display:flex;flex-direction:column;padding:15px}.sidebar,.main,.coach{width:100%;position:static}.sidebar{display:block}.sidebar-box{padding:12px;margin-bottom:12px}.side-nav{flex-direction:row;overflow:auto}.side-button{width:auto;white-space:nowrap}.side-button .side-icon{display:none}.sidebar .work-steps{display:none}.coach{display:grid;grid-template-columns:1fr 1fr}.hero{padding:25px 23px;min-height:190px}.panel{padding:19px}.genre-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:550px){.topbar{display:block}.top-actions{margin-top:12px}.top-pill{display:none}.grid2,.grid3,.genre-grid,.coach,.check-summary{grid-template-columns:1fr}.hero h1{font-size:32px}.write-header{display:block}.write-header .tag{margin-top:11px}.panel{padding:15px}.quiz-options{grid-template-columns:1fr}.button-row{align-items:stretch}.button-row .btn{flex:1}.section-heading{display:block}.section-heading .tag{margin-top:9px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    @media print{body{background:#fff}.topbar,.sidebar,.coach,.footnote,.button-row,.no-print,.toast{display:none!important}.layout{display:block!important;padding:0}.main{display:block}.panel{border:0;box-shadow:none}.review-block{break-inside:avoid}.essay-preview{border:0;padding:10px 0}.hero{display:none}.layout>*{width:100%}}

<body>
<div class="app">
  <header class="topbar">
    <button class="brand" id="brandButton" title="Go to workshop home"><span class="brand-mark" aria-hidden="true">W</span><span><strong>The Writing Workshop</strong><small>Read • Think • Write • Revise</small></span></button>
    <nav class="top-actions" aria-label="Main navigation">
      <button class="top-link" data-top="setup">Start</button><button class="top-link" data-top="library">Practice Library</button><button class="top-link" data-top="write">My Writing</button><button class="top-link" data-top="review">Review & Export</button><span class="top-pill" id="topGrade">GRADES 5–6 · RACES</span>

<script>
(function(){'use strict';
  const STORAGE_KEY='learning-hub-races-workshop-v1';
  const LETTER_INFO={R:{title:'Restate the question',short:'Restate',prompt:'Turn the question into a statement. Keep the important ideas from the prompt.',ask:'How can you turn the question into a statement without simply copying the question?',tips:['Read the question carefully and identify its main subject.','Turn question words into a statement.','Start with the topic, then save your opinion for the Answer step.'],frames:['The question of whether ___ matters because…','The events in the passage raise the question of…'],example:'The decision to leave the team raises an important question about responsibility.'},A:{title:'Answer with a claim',short:'Answer',prompt:'Give a clear answer and your main reason.',ask:'What do you believe? What is one reason someone should agree with you?',tips:['Take a clear position.','Tell the reader why you think that.','Avoid using “because it is good” without a reason.'],frames:['I believe ___ because ___.','The character’s choice was ___ since ___.'],example:'The character made a responsible decision because helping others was more important than winning.'},C:{title:'Cite text evidence',short:'Cite',prompt:'Use a specific detail or quotation from the text and identify where it appears.',ask:'What happened or was said in the text that gives a reader a reason to believe your claim?',tips:['Use a moment from the text, not just your opinion.','Short quotations and accurate paraphrases can both count as evidence.','For a real book, include the author and correct page number according to your teacher. For practice, use the paragraph number.'],frames:['One piece of evidence is when ___ (Author page).','In paragraph __, the narrator describes ___.'],example:'A useful detail is when the student returns to help a classmate instead of finishing the race (para. 2).'},E:{title:'Explain your evidence',short:'Explain',prompt:'Connect your evidence to your claim. Explain WHY the detail matters.',ask:'How does the evidence prove your point? What should a reader understand from it?',tips:['Do more than repeat what happened.','Explain the connection between your evidence and your claim.','Try using “This matters because…” or “This demonstrates…” as a starting point.'],frames:['This supports my claim because ___.','This detail matters because ___.'],example:'This demonstrates responsibility because the student gave up a personal advantage to protect someone else.'},S:{title:'Summarize your argument',short:'Summarize',prompt:'Return to your claim and end with what the evidence helps the reader understand.',ask:'What is the most important idea you want your reader to remember?',tips:['Restate your overall point in fresh words.','Bring your evidence and reasoning together.','Avoid introducing a brand-new argument.'],frames:['Overall, the evidence shows that ___.','Together, these examples demonstrate ___.'],example:'Overall, the decision shows that genuine responsibility means considering how our choices affect others.'}};
  const STORIES=[
    {id:'f1',genre:'Fantasy',icon:'✧',title:'The Lantern Keeper',blurb:'A rule, an enchanted light, and a difficult decision.',question:'Was Mira right to break the village rule?',paragraphs:["Every night the crystal lantern above Briar Glen lit the winding forest paths. Travelers used it to find their way home before the mist arrived. One evening, the lantern went dark. Mira learned that the only replacement crystal was locked in the mayor's office. The mayor had ordered everyone to stay away from the office until morning.","Mira heard travelers calling for help in the woods. She unlocked the office with the key used for emergencies and carried the crystal up the tower stairs. By the time the lantern shone again, three families were following its glow into the village. When the mayor arrived, Mira explained what she had done and offered to accept the consequences."]},
    {id:'f2',genre:'Fantasy',icon:'✧',title:'The River of Echoes',blurb:'An apprentice must decide whether to share a discovery.',question:'Did Tavin demonstrate courage when he spoke to the council?',paragraphs:["In the kingdom of Alderfall, apprentices were forbidden from correcting the royal council. During a drought, Tavin discovered that the river's stone gate had been closed by accident. He showed his notes to two older apprentices, but they refused to speak because they feared losing their positions.","At the next meeting, Tavin approached the council holding his damp map. His voice shook as he explained the closed gate and asked the leaders to inspect it. Several members dismissed him, yet one agreed to visit the river. The gate was opened that afternoon, and water began flowing toward the farms again."]},
    {id:'m1',genre:'Mystery',icon:'◇',title:'The Missing Trophy',blurb:'A missing object, a clue, and an unfair accusation.',question:'Did Leo act fairly when investigating the missing trophy?',paragraphs:["The middle school science trophy disappeared from a locked display case on Monday. Rumors spread that a new student, Sam, had taken it. Leo noticed a muddy footprint beside the case, but no one else seemed interested. He wrote down what he had observed before asking questions.","Leo discovered that the custodian had moved the trophy to protect it while repairing a leaking ceiling tile. The mud had come from his boots after working outside. Leo told the principal what he had learned and asked classmates to stop blaming Sam. The next morning the trophy was back in its case, and Leo apologized to Sam for the rumors."]},
    {id:'m2',genre:'Mystery',icon:'◇',title:'The Clocktower Letter',blurb:'A strange letter changes the meaning of an old legend.',question:'Was Amara wise to investigate before sharing her discovery?',paragraphs:["Amara found an unsigned letter inside the old town clock. It warned that the bell would stop forever at midnight. Her friends urged her to post the letter online, but Amara noticed that its paper matched a stack of theater flyers from the town museum.","She visited the museum and learned that the letter had been written years ago as part of a mystery performance. The clock's repair schedule explained why the bell would be silent that evening. Amara shared the explanation with her friends rather than spreading the frightening warning."]},
    {id:'sf1',genre:'Science Fiction',icon:'⬡',title:'The Oxygen Garden',blurb:'A space station computer makes a dangerous mistake.',question:'Did Nia show independent thinking when she questioned the computer?',paragraphs:["Plants in the station's oxygen garden supplied fresh air for the crew. During a long voyage, the garden began to wilt. The computer insisted that its watering schedule was correct, but Nia noticed a pipe leading to an empty storage tank instead of the plants.","Nia checked the equipment diagram and asked another crew member to verify the problem. Together they redirected the flow to the garden. The computer issued a warning, but the plants recovered by the following day. The captain thanked Nia for checking the evidence rather than blindly trusting an automated instruction."]},
    {id:'sf2',genre:'Science Fiction',icon:'⬡',title:'The Memory Archive',blurb:'A young archivist must protect another person’s story.',question:'Was Jun right to ask permission before sharing the recording?',paragraphs:["On a floating city above the clouds, Jun cared for the memory archive. He discovered a recording that might explain how the city had survived a great storm. Sharing it could help the city prepare for future emergencies, but the recording belonged to a retired engineer who had asked that it remain private.","Jun visited the engineer, explained why the information mattered, and listened to her concerns. She agreed to release the technical details while keeping her family's conversation private. The city gained useful knowledge, and the engineer retained control over her personal story."]},
    {id:'rf1',genre:'Realistic Fiction',icon:'☀',title:'The Last Seat',blurb:'A crowded bus creates an opportunity to help.',question:'Did Ellis show empathy during the bus ride?',paragraphs:["Ellis boarded the late bus after a long soccer practice. Only one seat remained, and his legs ached. At the next stop, an older passenger stepped aboard carrying two heavy grocery bags. Several riders looked away, hoping not to be asked to move.","Ellis stood and offered his seat. He also helped keep the bags from falling as the bus turned. The passenger thanked him, and Ellis smiled even though he had to stand for the rest of the ride. Later he said he hoped someone would help his grandmother in the same situation."]},
    {id:'rf2',genre:'Realistic Fiction',icon:'☀',title:'The Group Project',blurb:'A student tries to improve teamwork without an argument.',question:'Was Dani an effective leader during the project?',paragraphs:["Dani's science group had three days to finish a model bridge. Two students disagreed about which materials to use, and the third student stopped participating. Instead of choosing a side, Dani suggested testing two designs and recording how much weight each could hold.","Everyone agreed to a job. The tests showed that a combination of the designs worked best, and the quiet student presented the results. The bridge held more weight than either original design. Dani told the teacher that the final result came from everyone's ideas."]},
    {id:'h1',genre:'Historical Fiction',icon:'▤',title:'The Winter Messenger',blurb:'A young messenger helps neighbors during a harsh winter.',question:'Did Ada demonstrate determination while delivering the message?',paragraphs:["In a mountain settlement in 1892, a heavy snowfall blocked the main road. Ada learned that the neighboring village had run low on medicine. Her father wrote a note telling the village doctor where more supplies could be collected, but the usual messenger could not travel.","Ada set out with a neighbor who knew the narrow trail. They stopped twice to rest and changed their route when snow covered a bridge. Before sunset, they reached the doctor and delivered the note. The doctor arranged for supplies to be carried to the village the following morning."]},
    {id:'h2',genre:'Historical Fiction',icon:'▤',title:'The Print Shop',blurb:'A newspaper apprentice faces a question about accuracy.',question:'Did Clara act responsibly when preparing the newspaper?',paragraphs:["In an 1880s town, Clara worked at a small print shop. A visitor claimed that the community well had been poisoned and demanded that she print the warning immediately. Clara knew that a false report could frighten families, so she asked for evidence before setting the type.","She visited the well keeper and two nearby households. They discovered that the water's unusual color came from harmless clay washed in by a storm. Clara printed a short notice explaining the cause and encouraged residents to report any genuine changes to the town council."]},
    {id:'a1',genre:'Adventure',icon:'▲',title:'The Canyon Crossing',blurb:'A hiking team revises a risky plan.',question:'Was Rowan a responsible team member during the hike?',paragraphs:["Rowan's hiking group reached a canyon bridge just as dark clouds gathered. The map showed the bridge as the shortest route to camp, but several wooden boards were missing. One student urged everyone to cross quickly before the storm arrived.","Rowan suggested checking the alternate trail instead. The group used a compass to follow the longer route and arrived at a sheltered campsite before heavy rain began. The next morning they learned that the bridge had been closed for repairs. Their guide praised the group for choosing safety over speed."]},
    {id:'a2',genre:'Adventure',icon:'▲',title:'The Signal Fire',blurb:'Two explorers must work together to find help.',question:'Did Kira and Mateo succeed because they cooperated?',paragraphs:["Kira and Mateo became separated from their expedition after fog covered a coastal trail. Kira knew how to build a safe signal fire, but she could not find dry wood. Mateo knew where fallen branches collected under a rocky ledge, yet he had never built a fire before.","They combined their knowledge, gathered the wood, and made a small fire in a clear area away from dry grass. Kira added damp leaves to create visible smoke while Mateo watched the wind. Their expedition leader spotted the signal and reached them before nightfall."]}
  ];
  const GENRES=[{name:'Fantasy',icon:'✧',desc:'Magic, choices, bravery'},{name:'Mystery',icon:'◇',desc:'Clues, fairness, conclusions'},{name:'Science Fiction',icon:'⬡',desc:'Technology, ethics, discovery'},{name:'Realistic Fiction',icon:'☀',desc:'Friendships, decisions, empathy'},{name:'Historical Fiction',icon:'▤',desc:'Challenges, integrity, perspective'},{name:'Adventure',icon:'▲',desc:'Teamwork, risks, perseverance'}];
  const QUIZ=[
    {text:'The main character was responsible because she checked the facts first.',answer:'A',why:'It makes a claim and gives a reason.'},
    {text:'In paragraph 2, the group chooses the longer path to avoid the broken bridge.',answer:'C',why:'It points to a specific event as evidence.'},
    {text:'This proves the group valued safety because they accepted a delay to avoid danger.',answer:'E',why:'It explains WHY the chosen evidence supports the claim.'},
    {text:'The question of whether the decision was fair is important in this story.',answer:'R',why:'It turns the question into a statement without yet proving the claim.'},
    {text:'Overall, the character’s thoughtful actions show that honesty builds trust.',answer:'S',why:'It summarizes the main argument.'},
    {text:'The narrator says, “The gate was opened that afternoon” (para. 2).',answer:'C',why:'It cites a specific detail and location.'},
    {text:'This matters because making the plan together allowed everyone to contribute.',answer:'E',why:'It analyzes the importance of what happened.'},
    {text:'The explorer showed courage because he spoke up despite his fear.',answer:'A',why:'It gives a direct claim and reason.'},
    {text:'The passage raises a question about whether the team should have waited.',answer:'R',why:'It restates the question as a statement.'},
    {text:'Taken together, these details suggest that patience leads to better decisions.',answer:'S',why:'It draws a final conclusion from the argument.'}
  ];
  const STOP=new Set('the a an is are was were be been being does did do what when where why how who whom which whose this that these those to in on at of with for from by as and or but it its he she they them their his her you your i we our book story passage text character about into after before really most prove show shows mean means can could would should had has have not one two there then than so very because'.split(' '));
  const $=sel=>document.querySelector(sel), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const words=s=>String(s||'').trim().match(/\b[\w’'-]+\b/g)||[];
  const wc=s=>words(s).length;
  const tokenize=s=>String(s||'').toLowerCase().match(/[a-z]+/g)?.filter(w=>w.length>3&&!STOP.has(w))||[];
  const sid=()=> 'draft-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
  const stepsFor=grade=>Number(grade)>=7?['R','A','C1','E1','C2','E2','S']:['R','A','C1','E1','S'];
  const letterOf=step=>step[0];
  const stepLabel=step=>({C1:'Evidence #1',E1:'Explain #1',C2:'Evidence #2',E2:'Explain #2'})[step]||LETTER_INFO[step].short;
  const iso=()=>new Date().toISOString();
  const newDraft=(grade=6)=>({id:sid(),grade:Number(grade),mode:'book',title:'',author:'',chapter:'',student:'',question:'',storyId:null,answers:{R:'',A:'',C1:'',E1:'',C2:'',E2:'',S:''},polished:'',polishedSnapshot:'',created:iso(),updated:iso()});
  let state={drafts:[newDraft(6)],active:null,view:'setup',currentStep:0,helpShown:0,settings:{help:'full',requireCitations:true},quizIndex:0,quizScore:0,quizAnswered:false,quizChoice:null};
  state.active=state.drafts[0].id;
  try{let raw=localStorage.getItem(STORAGE_KEY);if(raw){let parsed=JSON.parse(raw);if(parsed&&Array.isArray(parsed.drafts)&&parsed.drafts.length){state.drafts=parsed.drafts.filter(d=>d&&d.id&&d.answers).slice(0,60).map(d=>({...newDraft(d.grade||6),...d,answers:{...newDraft().answers,...d.answers}}));state.active=state.drafts.some(d=>d.id===parsed.active)?parsed.active:state.drafts[0].id;state.settings={...state.settings,...parsed.settings};}}}catch(e){console.warn('Storage unavailable or invalid:',e)}
  let toastTimer=null;let persistOk=true;
  const current=()=>state.drafts.find(d=>d.id===state.active)||state.drafts[0];
  function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({drafts:state.drafts,active:state.active,settings:state.settings}));persistOk=true}catch(e){persistOk=false}}
  function touch(){current().updated=iso();persist()}
  function notify(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
  function getStory(d=current()){return STORIES.find(s=>s.id===d.storyId)||null}
  function projectLabel(d=current()){return d.mode==='practice'?(getStory(d)?.title||'Practice story'):(d.title||'Untitled book assignment')}
  function currentQuestion(d=current()){return d.mode==='practice'?(getStory(d)?.question||''):d.question}
  function citationPattern(text,d=current()){return d.mode==='practice'?/\((?:para\.?|paragraph|¶)\s*\d+\)/i.test(text):/\([A-Za-z][A-Za-z .'-]*\s+\d+(?:[-–]\d+)?\)/.test(text)||/\b(?:page|pg\.?|p\.)\s*\d+\b/i.test(text)}
  function mechanics(s){let t=s.trim();return {capital:/^[“"'‘(]*[A-Z]/.test(t),end:/[.!?][”"']?$/.test(t)}}
  function overlap(s,t){const a=new Set(tokenize(s)),b=new Set(tokenize(t));return a.size?([...a].filter(w=>b.has(w)).length/a.size):0}
  function analyze(step,d=current()){
    const a=d.answers[step]||'',length=wc(a),L=letterOf(step),req=(d.grade>=7?{R:9,A:11,C:13,E:17,S:13}:{R:7,A:9,C:10,E:13,S:10})[L];
    const ch=[];const push=(label,ok,kind='')=>ch.push({label,ok,kind});
    if(!a.trim())return {checks:[{label:'Start writing to see suggestions.',ok:false,kind:'neutral'}],score:0,ready:false,empty:true,req};
    push(`Develop your idea (${length} of about ${req}+ words)`,length>=req);
    const mec=mechanics(a);push('Begin with a capital letter',mec.capital);push('End with sentence punctuation',mec.end);
    const q=currentQuestion(d);
    if(L==='R'){
      const target=new Set(tokenize(q));const hit=[...target].filter(w=>tokenize(a).includes(w)).length;
      if(target.size)push('Include a key idea from the question',hit>=1,'suggestion');
      push('Turn the question into a statement',!a.trim().endsWith('?'));
    }
    if(L==='A'){
      push('Express a reason for your claim',/\b(because|since|as a result|due to|so that|in order to)\b/i.test(a),'suggestion');
      push('Avoid answering with only yes or no',!/^\s*(?:yes|no)[.!,\s]*$/i.test(a));
    }
    if(L==='C'){
      if(state.settings.requireCitations)push(d.mode==='practice'?'Cite a paragraph, such as (para. 2)':'Include a source/page citation, such as (Lowry 149)',citationPattern(a,d));
      push('Use a specific event or detail from the text',length>=req,'suggestion');
      if(d.mode==='practice'){const story=getStory(d);if(story){const joined=story.paragraphs.join(' ');push('Use words or details found in the practice story',overlap(a,joined)>=.1,'suggestion')}}

    if(L==='E'){

      push('Explain why the evidence matters',/\b(because|since|therefore|shows|demonstrates|reveals|suggests|proves|means|indicates|illustrates|highlights|matters|supports|reason)\b/i.test(a),'suggestion');
      if(wc(evidence)>5 && wc(a)>5)push('Go beyond repeating the evidence',overlap(a,evidence)<.76,'suggestion');
    }
    if(L==='S'){

      push('Do not introduce a new quotation',!/[“"][^“"]{6,}[”"]/.test(a),'suggestion');
    }
    const ready=length>=req&&mec.capital&&mec.end&&(L!=='C'||!state.settings.requireCitations||citationPattern(a,d));
    return {checks:ch,score:ch.filter(c=>c.ok).length,ready,empty:false,req};
  }
  function isFilled(step,d=current()){return wc(d.answers[step]||'')>=4}

  function sidebar(){const d=current(),keys=stepsFor(d.grade),n=completed(d),p=Math.round(n/keys.length*100);return `<aside class="sidebar"><section class="sidebar-box"><div class="sidebar-title">Workshop menu</div><nav class="side-nav" aria-label="Workshop sections">${[['setup','⌂','My assignment'],['library','▦','Practice stories'],['write','✎','Writing desk'],['review','✓','Review & export'],['drills','◈','Skill challenge'],['drafts','▤','My drafts'],['settings','⚙','Settings']].map(([v,i,label])=>`<button class="side-button ${state.view===v?'active':''}" data-go="${v}"><span class="side-icon" aria-hidden="true">${i}</span>${label}</button>`).join('')}</nav></section><section class="sidebar-box work-steps"><div class="eyebrow">MY WRITING PATH</div><h3 style="margin:4px 0 7px">${d.grade<=6?'RACES':'RACECES'} <span class="tag neutral">Grade ${d.grade}</span></h3><div class="progress" role="progressbar" aria-label="Steps started" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${keys.length}"><div class="progress-bar" style="width:${p}%"></div></div><p class="small muted">${n} of ${keys.length} sections started</p><div class="step-list">${keys.map((key,i)=>`<button class="step-row ${state.view==='write'&&state.currentStep===i?'active':''}" data-step="${i}"><span class="letter ${letterOf(key)}">${letterOf(key)}</span><span class="step-name">${esc(stepLabel(key))}</span><span class="step-status ${isFilled(key,d)?'complete':''}" aria-label="${isFilled(key,d)?'Started':'Not started'}">${isFilled(key,d)?'✓':'○'}</span></button>`).join('')}</div><div class="divider"></div><p class="micro muted">${persistOk?'Autosaves on this browser':'Browser storage may be blocked. Download a backup in My drafts.'}</p></section></aside>`}
  function coach(){const d=current(),key=stepsFor(d.grade)[Math.min(state.currentStep,stepsFor(d.grade).length-1)]||'R',info=LETTER_INFO[letterOf(key)];return `<aside class="coach" aria-label="Writing coach"><section class="coach-box"><div class="coach-header"><span class="coach-avatar" aria-hidden="true">✦</span><div><h3>Writing coach</h3><div class="micro muted">Helpful checks, not a grade</div></div></div>${state.view==='write'?`<p class="small muted" id="coachPrompt">${esc(info.ask)}</p><div class="divider"></div><div class="eyebrow" style="margin-bottom:12px">YOUR STEP CHECKLIST</div><div class="check-list" id="coachChecks"></div><div class="divider"></div><div class="callout" id="coachGuidance">Use the checklist to strengthen your draft. A computer cannot verify whether evidence is true or your argument is correct.</div>`:`<p class="small">Every strong response begins with a clear claim, specific evidence, and an explanation of why the evidence matters.</p><div class="callout">Your ideas and your own words matter. Built-in checks can suggest revisions but cannot read or understand your entire book.</div>`}</section><section class="coach-box"><div class="eyebrow">Remember the difference</div><div style="margin-top:8px"><strong style="color:#8e6826">CITE</strong><p class="small muted">What happened in the text? Where can the reader find it?</p><strong style="color:var(--purple)">EXPLAIN</strong><p class="small muted" style="margin-bottom:0">Why does that detail support what you believe?</p></div></section>${state.view==='write'?`<section class="coach-box"><div class="eyebrow">LIVE ESSAY PREVIEW</div><div class="mini-preview" style="margin-top:11px"><p id="livePreview">${esc(composed(d).slice(0,300)||'Your response will appear here as you write.')}${composed(d).length>300?'…':''}</p></div><div style="margin-top:12px"><button class="btn smallbtn" data-go="review">Open full preview →</button></div></section>`:''}</aside>`}

  function setupHTML(){const d=current(),story=getStory(d);return `<section class="hero"><div class="eyebrow">YOUR IDEAS. YOUR WORDS.</div><h1>Every great answer<br>starts somewhere.</h1><p>Take one step at a time. Collect evidence, explain your thinking, and turn your ideas into a complete written response.</p><div class="hero-buttons"><button class="btn gold" data-go="write">${completed(d)>0?'Continue my writing':'Go to my writing desk'} →</button><button class="btn" data-go="library">Try a practice story</button></div></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">STEP 1</div><h2>Set up your assignment</h2><p class="muted small">Choose a grade and tell the workshop what you are writing about.</p></div></div><div class="field-label" style="margin-bottom:9px">Grade level</div><div class="grid2" style="margin-bottom:18px"><button class="mode-card ${d.grade<=6?'chosen':''}" data-grade-group="5"><span class="mode-top" aria-hidden="true">R·A·C·E·S</span><strong>Grades 5–6</strong><p>Restate, Answer, Cite, Explain, Summarize · one piece of evidence</p></button><button class="mode-card ${d.grade>=7?'chosen':''}" data-grade-group="7"><span class="mode-top" aria-hidden="true">R·A·C·E·C·E·S</span><strong>Grades 7–8</strong><p>Add another piece of evidence and another explanation.</p></button></div><div class="grid2"><div class="field"><label for="gradePick">My grade</label><select id="gradePick" data-field="grade"><option value="5" ${d.grade===5?'selected':''}>5th grade</option><option value="6" ${d.grade===6?'selected':''}>6th grade</option><option value="7" ${d.grade===7?'selected':''}>7th grade</option><option value="8" ${d.grade===8?'selected':''}>8th grade</option></select></div><div class="field"><label for="studentName">Student name <span class="muted">(optional)</span></label><input id="studentName" data-field="student" value="${esc(d.student)}" placeholder="Your name" maxlength="100"></div></div><div class="field-label" style="margin-bottom:9px">I'm working on…</div><div class="grid2" style="margin-bottom:19px"><button class="mode-card ${d.mode==='book'?'chosen':''}" data-mode="book"><span class="mode-top" aria-hidden="true">▤</span><strong>My own book assignment</strong><p>Use your teacher's prompt and evidence you find in your book.</p></button><button class="mode-card ${d.mode==='practice'?'chosen':''}" data-mode="practice"><span class="mode-top" aria-hidden="true">✧</span><strong>A fictional practice story</strong><p>Read one of our original short passages to practice the skill.</p></button></div>${d.mode==='book'?`<div class="grid2"><div class="field"><label for="bookTitle">Book title</label><input id="bookTitle" data-field="title" value="${esc(d.title)}" placeholder="What book are you reading?" maxlength="160"></div><div class="field"><label for="bookAuthor">Author</label><input id="bookAuthor" data-field="author" value="${esc(d.author)}" placeholder="Author's name" maxlength="120"></div></div><div class="field"><label for="chapter">Chapter / pages <span class="muted">(optional)</span></label><input id="chapter" data-field="chapter" value="${esc(d.chapter)}" placeholder="e.g. Chapter 19" maxlength="80"></div><div class="field"><label for="assignmentQuestion">Teacher's question or writing prompt</label><textarea id="assignmentQuestion" rows="3" data-field="question" placeholder="Type the exact question you were given...">${esc(d.question)}</textarea><small>The workshop does not know what happens in your book. Check every quotation and page number yourself.</small></div>`:`<div class="story-banner"><div class="paper-heading">Current practice story</div><h3>${esc(story?.title||'No practice story selected')}</h3><p class="small muted" style="margin:7px 0">${esc(story?.question||'Visit the practice library and pick a story.')}</p><button class="btn smallbtn" data-go="library">${story?'Change story':'Choose a story'}</button></div>`}<div class="button-row between" style="margin-top:5px"><span class="small muted">You can change the assignment later.</span><button class="btn primary" data-go="write">Start writing →</button></div></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">HOW IT WORKS</div><h2>Small steps. Strong writing.</h2></div></div><div class="grid3"><div><span class="letter R">R</span><h4 style="margin-top:10px">Plan your response</h4><p class="small muted">Choose a claim and locate relevant evidence.</p></div><div><span class="letter E">E</span><h4 style="margin-top:10px">Strengthen your ideas</h4><p class="small muted">Get targeted prompts and revise your own sentences.</p></div><div><span class="letter S">S</span><h4 style="margin-top:10px">Share your work</h4><p class="small muted">Review, copy to Google Docs, download, or print.</p></div></div></section>`}
  function libraryHTML(){const d=current();return `<section class="hero" style="min-height:180px"><div class="eyebrow">READ. THINK. PRACTICE.</div><h1>Story practice library</h1><p>Original fictional passages with questions. No spoilers and no answers from books you are assigned in class.</p><div class="hero-buttons"><button class="btn gold" id="surprise">Surprise me with a story ✧</button><span class="tag" style="background:#ffffff22;color:#fff">${STORIES.length} original passages • 6 genres</span></div></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">EXPLORE BY GENRE</div><h2>Pick a kind of story</h2><p class="small muted">Every genre has two short passages. Choose one and write a complete response to its question.</p></div></div><div class="genre-grid">${GENRES.map(g=>`<div class="genre-card"><span class="genre-icon" aria-hidden="true">${g.icon}</span><h3>${g.name}</h3><p>${g.desc}</p>${STORIES.filter(s=>s.genre===g.name).map(s=>`<button class="btn smallbtn ghost" data-story="${s.id}">${esc(s.title)} →</button>`).join('')}</div>`).join('')}</div></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">STORY EXCERPT</div><h2>How to cite practice stories</h2></div></div><div class="story-banner"><p class="small">Our passages have paragraph numbers instead of printed book pages. You can cite a practice detail like this: <strong>(para. 2)</strong>.</p><p class="small" style="margin:0">When writing about a real book, use the author and the actual page number requested by your teacher, for example <strong>(Lowry 149)</strong>. Never invent a quote or page number.</p></div></section>`}
  function writeHTML(){const d=current(),keys=stepsFor(d.grade);state.currentStep=Math.max(0,Math.min(state.currentStep,keys.length-1));let k=keys[state.currentStep],L=letterOf(k),info=LETTER_INFO[L],story=getStory(d),q=currentQuestion(d),v=d.answers[k]||'';let exampleAllowed=state.settings.help!=='off';return `<section class="write-header"><div><div class="eyebrow">WRITING DESK • STEP ${state.currentStep+1} OF ${keys.length}</div><h2>${esc(info.title)}${/[12]$/.test(k)?' '+(k.endsWith('1')?'#1':'#2'):''}</h2><p>${esc(info.prompt)}</p></div><span class="tag">${d.grade<=6?'RACES':'RACECES'} • Grade ${d.grade}</span></section>${d.mode==='practice'&&story?`<section class="panel flush"><div style="padding:17px 20px;border-bottom:1px solid var(--line)" class="button-row between"><div><span class="eyebrow">${esc(story.genre)} • original passage</span><h3 style="margin-top:4px">${esc(story.title)}</h3></div><button class="btn smallbtn" id="togglePassage" aria-expanded="true">Hide passage ↑</button></div><div id="passageBox" class="story-banner" style="border:0;border-radius:0;padding:16px 23px"><div class="story-text">${story.paragraphs.map((p,i)=>`<div class="story-para"><span class="para-number">¶${i+1}</span><p>${esc(p)}</p></div>`).join('')}</div></div></section>`:''}<section class="panel"><div class="prompt-card"><strong>YOUR WRITING QUESTION</strong><p>${q?esc(q):'<span class="muted">No question entered yet. Open My assignment and add your teacher’s question.</span>'}</p></div><div style="margin-top:21px"><div class="eyebrow">${L} · ${esc(info.short.toUpperCase())}</div><h3 style="margin-top:6px;margin-bottom:7px">${esc(info.ask)}</h3><p class="small muted">${L==='C'&&d.mode==='practice'?'Use a detail from the numbered practice passage above. Cite the paragraph number.':L==='C'?'Use a detail you found in your book, and cite the actual page.':L==='E'?'Connect this evidence to your claim in your own words.':'Write your own sentence. You can revise it at any time.'}</p><label class="screen-reader" for="writingInput">Your answer for ${esc(stepLabel(k))}</label><textarea class="writing-area" id="writingInput" spellcheck="true" data-answer="${k}" placeholder="${L==='C'?'One piece of evidence is...':L==='E'?'This supports my claim because...':L==='A'?'I think... because...':L==='S'?'Overall...':'Turn the question into a statement...'}">${esc(v)}</textarea><div class="writing-meta"><span class="wordcount" id="wordCounter">${wc(v)} words</span><span class="tag neutral" id="draftState">${v.trim()?'Draft in progress':'Start writing'}</span></div>${exampleAllowed?`<div class="button-row"><button class="btn smallbtn" id="hintButton">${state.helpShown?'Another hint':'I need a hint'} ✧</button><button class="btn smallbtn ghost" id="showExample">See an unrelated example</button><button class="btn smallbtn ghost" id="checkStep">Check this step ✓</button></div><div id="hintArea" aria-live="polite"></div>`:`<div class="note">Extra hints and model examples are turned off in Workshop settings. You can still see basic writing feedback.</div>`}<div class="divider"></div><div class="button-row between"><button class="btn" id="prevStep" ${state.currentStep===0?'disabled':''}>← Previous step</button><button class="btn primary" id="nextStep">${state.currentStep===keys.length-1?'Review my response →':'Next step →'}</button></div></div></section>${L==='C'?`<section class="panel"><h3 style="margin-bottom:11px">Evidence or explanation?</h3><div class="grid2"><div class="story-banner"><strong>Evidence</strong><p class="small" style="margin:7px 0 0">A detail, event, or quotation from the text, with a location to help someone find it.</p></div><div class="story-banner" style="background:#f4effa;border-color:#e7dbf4"><strong>Explanation</strong><p class="small" style="margin:7px 0 0">Your reasoning about how that detail supports your answer. This is not just retelling the story.</p></div></div></section>`:''}`}
  function reviewHTML(){const d=current(),all=stepsFor(d.grade),finished=completed(d),built=composed(d),output=outputText(d),textwords=wc(output),checks=all.map(k=>({key:k,analysis:analyze(k,d)})),ready=checks.filter(x=>x.analysis.ready).length;return `<section class="hero" style="min-height:170px"><div class="eyebrow">YOUR FINISH LINE</div><h1>Review & share</h1><p>Read the whole paragraph aloud. Make revisions and check your book evidence before turning in your assignment.</p></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">WRITING READINESS</div><h2>Your progress</h2><p class="small muted">These are structural writing checks, not grades or proof that an answer is correct.</p></div></div><div class="check-summary"><div class="metric"><strong>${finished}/${all.length}</strong><small>Sections started</small></div><div class="metric"><strong>${ready}/${all.length}</strong><small>Basic checks met</small></div><div class="metric"><strong id="reviewWords">${textwords}</strong><small>Words in final draft</small></div></div><div class="divider"></div><div class="check-list">${checks.map(x=>`<div class="check-item ${x.analysis.ready?'ok':''}"><span class="check-symbol">${x.analysis.ready?'✓':'!'}</span><div><strong>${esc(stepLabel(x.key))}</strong> — ${x.analysis.empty?'Nothing written yet':x.analysis.ready?'Meets basic format checks':'Review this section for missing writing checks'} <button class="btn smallbtn ghost" style="min-height:26px;padding:2px 8px;margin-left:4px" data-review-step="${all.indexOf(x.key)}">Edit</button></div></div>`).join('')}</div><div class="divider"></div><div class="note"><strong>Important:</strong> Only you and your teacher can decide whether your claim is accurate, evidence really appears in the book, and your explanation makes sense. Passing the checks is not an assignment score.</div></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">ASSEMBLED FROM YOUR STEPS</div><h2>My complete response</h2><p class="small muted">Your sections are joined in order. Read for repeated openings, transitions, and a natural flow.</p></div></div><div class="essay-preview ${!built?'placeholder':''}" id="assembledPreview">${built?esc(built):'Your assembled response will appear here after you begin writing.'}</div><div class="button-row" style="margin-top:12px"><button class="btn smallbtn" data-go="write">Revise my steps</button><button class="btn smallbtn" id="rebuildFinal">${d.polished?'Replace final draft with assembled steps':'Put assembled response in final editor'}</button></div><div class="divider"></div><div class="field"><label for="polishInput">Polish your final response <span class="muted">(optional)</span></label><textarea id="polishInput" rows="8" placeholder="Use this space to improve transitions, remove repeated words, and polish your complete paragraph...">${esc(d.polished)}</textarea><small>Edits here are saved as a final version; your individual RACES sections are kept separately. Leave this empty to export your assembled response.</small></div>${isStale(d)?`<div class="tag warn" id="staleNote">Your step answers changed after this final version. Rebuild if you want the latest step text.</div>`:`<div id="staleNote"></div>`}<div class="divider"></div><div class="field-label" style="margin-bottom:7px">Final response preview</div><div class="essay-preview ${!output?'placeholder':''}" id="finalPreview">${output?esc(output):'There is no response to export yet.'}</div></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">TURN IT IN</div><h2>Copy, save, or print</h2><p class="small muted">Choose what works best for your teacher's assignment.</p></div></div><div class="button-row"><button class="btn primary" id="copyEssay">Copy paragraph only</button><button class="btn" id="copyWithDetails">Copy with assignment details</button><button class="btn" id="googleDocs">Open Google Docs ↗</button><button class="btn" id="downloadTxt">Download .txt</button><button class="btn" id="downloadHtml">Download printable .html</button><button class="btn" id="printEssay">Print</button><button class="btn" id="emailEssay">Prepare email ↗</button></div><div class="note" style="margin-top:17px">Google Docs: choose <strong>Copy my writing</strong>, then <strong>Open Google Docs</strong>, start a document and paste. This workshop does not access school Google accounts or send emails automatically. If email does not open, copy and paste your response manually.</div></section>`}
  function drillHTML(){const i=state.quizIndex%QUIZ.length,q=QUIZ[i];return `<section class="hero" style="min-height:176px"><div class="eyebrow">QUICK SKILL CHALLENGE</div><h1>Cite or explain?</h1><p>Practice identifying the parts of a strong written response before trying them in your own writing.</p></section><section class="panel"><div class="button-row between"><span class="tag">Question ${i+1} of ${QUIZ.length}</span><span class="semibold small">${state.quizScore} correct so far</span></div><div class="quickquestion">“${esc(q.text)}”</div><h3 style="margin-bottom:12px">Which part of RACES does this sentence demonstrate?</h3><div class="quiz-options">${[['R','R — Restate'],['A','A — Answer'],['C','C — Cite evidence'],['E','E — Explain'],['S','S — Summarize']].map(([a,b])=>`<button data-quiz="${a}" ${state.quizAnswered?'disabled':''} style="${state.quizAnswered&&a===q.answer?'border-color:#238364;background:#e2f3e7;':''}">${esc(b)}</button>`).join('')}</div>${state.quizAnswered?`<div class="quiz-result ${state.quizChoice===q.answer?'good':''}"><strong>${state.quizChoice===q.answer?'Correct!':'Good try.'}</strong> ${esc(q.why)} ${state.quizChoice!==q.answer?'The best choice is '+q.answer+'.':''}</div><div style="margin-top:14px" class="button-row"><button class="btn primary" id="nextQuiz">Next challenge →</button><button class="btn" id="resetQuiz">Start over</button></div>`:'<p class="small muted" style="margin-top:13px">Try it before opening your actual assignment.</p>'}</section>`}
  function draftsHTML(){const d=current();return `<section class="hero" style="min-height:170px"><div class="eyebrow">KEEP YOUR WORK</div><h1>My drafts</h1><p>Manage multiple writing assignments, save a backup, or restore a saved workshop project.</p></section><section class="panel"><div class="section-heading"><div><div class="eyebrow">ON THIS DEVICE</div><h2>Saved drafts (${state.drafts.length})</h2><p class="small muted">These drafts are stored in this browser profile, not online. A different computer may not have them.</p></div><button class="btn primary" id="newDraft">+ New draft</button></div><div class="draft-list">${state.drafts.slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).map(s=>`<div class="draft-item ${s.id===d.id?'active':''}"><button data-select-draft="${esc(s.id)}"><strong>${esc(projectLabel(s))} ${s.id===d.id?'(open)':''}</strong><small>Grade ${s.grade} • ${s.mode==='practice'?'Practice':'Book'} • ${new Date(s.updated||s.created).toLocaleDateString()}</small></button><button class="btn smallbtn danger" style="flex:0" data-delete-draft="${esc(s.id)}" title="Delete draft" aria-label="Delete ${esc(projectLabel(s))}">✕</button></div>`).join('')}</div><div class="divider"></div><div class="button-row"><button class="btn" id="backupDraft">Download current draft backup (.json)</button><button class="btn" id="importDraft">Import a draft (.json)</button></div><p class="note" style="margin-top:13px"><strong>Shared computers:</strong> Drafts may be visible to anyone using the same browser profile. Avoid entering private student information, and delete drafts or use a separate school profile when necessary. Download a backup before clearing browser data.</p></section>`}
  function settingsHTML(){const s=state.settings;return `<section class="hero" style="min-height:170px"><div class="eyebrow">WORKSHOP OPTIONS</div><h1>Classroom settings</h1><p>Adjust the kind of assistance offered while students write. These settings are local, not password-protected controls.</p></section><section class="panel"><div class="field"><label for="helpLevel">How much help should the writing coach provide?</label><select id="helpLevel"><option value="full" ${s.help==='full'?'selected':''}>Full support — hints and example sentences</option><option value="light" ${s.help==='light'?'selected':''}>Guided — short hints only</option><option value="off" ${s.help==='off'?'selected':''}>Independent — no hints or examples</option></select><small>Structural checks are still shown even in Independent mode.</small></div><div class="field"><label for="citeRequirement">Citation reminder</label><select id="citeRequirement"><option value="yes" ${s.requireCitations?'selected':''}>Remind students to include citations</option><option value="no" ${!s.requireCitations?'selected':''}>Do not require citation format for step readiness</option></select></div><div class="note">This is a student-facing browser app, so these settings are not secured against changes. For assignments where strict assessment conditions matter, your teacher's actual instructions always take priority.</div><div class="divider"></div><div class="button-row"><button class="btn" id="backupDraft">Download draft backup</button><button class="btn danger" id="clearAll">Erase all drafts on this browser</button></div></section>`}
  function refreshWriting(){let d=current(),key=stepsFor(d.grade)[state.currentStep],t=d.answers[key]||'',a=analyze(key,d),checks=$('#coachChecks');if(!checks)return;checks.innerHTML=a.checks.map(c=>`<div class="check-item ${c.ok?'ok':c.kind==='neutral'?'neutral':''}"><span class="check-symbol">${c.ok?'✓':c.kind==='neutral'?'·':'!'}</span><span>${esc(c.label)}</span></div>`).join('');let guide=$('#coachGuidance');if(guide){let unchecked=a.checks.filter(c=>!c.ok&&c.kind!=='neutral');guide.textContent=!t.trim()?'Start with your own idea. Use a hint if you get stuck.':unchecked.length?`Try this next: ${unchecked[0].label}. This is a suggestion, not a grade.`:'Basic format checks look good. Now reread your writing to make sure the idea and evidence are accurate.';}let el=$('#wordCounter');if(el)el.textContent=`${wc(t)} words`;el=$('#draftState');if(el){el.textContent=!t.trim()?'Start writing':a.ready?'Basic checks met ✓':'Draft in progress';el.className='tag '+(a.ready?'dark':'neutral')}el=$('#livePreview');if(el){let c=composed(d);el.textContent=(c.slice(0,300)+(c.length>300?'…':''))||'Your response will appear here as you write.'}let p=$('.progress-bar');if(p)p.style.width=`${Math.round(completed(d)/stepsFor(d.grade).length*100)}%`;const n=$('.sidebar .progress');if(n)n.setAttribute('aria-valuenow',completed(d));const s=$('.sidebar .work-steps .small.muted');if(s)s.textContent=`${completed(d)} of ${stepsFor(d.grade).length} sections started`;document.querySelectorAll('.step-row').forEach((el,i)=>{let st=stepsFor(d.grade)[i],span=el.querySelector('.step-status');span.textContent=isFilled(st,d)?'✓':'○';span.classList.toggle('complete',isFilled(st,d));span.setAttribute('aria-label',isFilled(st,d)?'Started':'Not started')})}
  function attachInputs(){document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('input',e=>{let f=el.dataset.field,d=current();if(f==='grade'){let oldGrade=d.grade;d.grade=Number(el.value);if(oldGrade!==d.grade){state.currentStep=0;touch();render();return}}else{d[f]=el.value;touch()}}));let input=$('#writingInput');if(input)input.addEventListener('input',()=>{current().answers[input.dataset.answer]=input.value;touch();refreshWriting()});let polish=$('#polishInput');if(polish)polish.addEventListener('input',()=>{current().polished=polish.value;current().polishedSnapshot=composed();touch();let preview=$('#finalPreview');if(preview){preview.textContent=outputText()||'There is no response to export yet.';preview.classList.toggle('placeholder',!outputText())}const count=$('#reviewWords');if(count)count.textContent=wc(outputText());let stale=$('#staleNote');if(stale)stale.innerHTML=''});let help=$('#helpLevel');if(help)help.addEventListener('change',()=>{state.settings.help=help.value;persist();notify('Help level updated')});let cite=$('#citeRequirement');if(cite)cite.addEventListener('change',()=>{state.settings.requireCitations=cite.value==='yes';persist();notify('Citation reminder updated')})}
  function setGradeGroup(start){let d=current();d.grade=Number(start);state.currentStep=0;touch();render()}
  function chooseStory(id){const s=STORIES.find(x=>x.id===id);if(!s)return;let d=current();let hasWork=Object.values(d.answers).some(x=>x.trim());if(hasWork&&!confirm('Changing the practice story starts a new draft so your current writing is not overwritten. Continue?'))return;let next=newDraft(d.grade);next.student=d.student;next.mode='practice';next.storyId=id;next.title=s.title;next.question=s.question;state.drafts.push(next);state.active=next.id;state.currentStep=0;touch();go('write');notify(`Practice story selected: ${s.title}`)}
  function setMode(mode){let d=current();if(d.mode===mode)return;if(mode==='practice'&&!d.storyId){go('library');return}d.mode=mode;touch();render()}
  function nextStep(dir){const keys=stepsFor(current().grade);const next=state.currentStep+dir;if(next>=keys.length){go('review')}else{state.currentStep=Math.max(0,next);state.helpShown=0;render();window.scrollTo({top:0,behavior:'smooth'});const input=$('#writingInput');if(input)input.focus({preventScroll:true})}}
  function showHint(){const k=stepsFor(current().grade)[state.currentStep],info=LETTER_INFO[letterOf(k)],area=$('#hintArea');if(!area)return;let h=state.helpShown;if(state.settings.help==='light')h=Math.min(h,1);let prompt=h===0?info.tips[0]:h===1?info.tips[1]:h===2?(info.frames[0]||info.tips[2]):info.tips[2];area.innerHTML=`<div class="hint-card" style="margin-top:11px"><h4>Helpful nudge ${Math.min(h+1,3)}</h4><p>${esc(prompt)}</p></div>`;state.helpShown=Math.min(state.helpShown+1,2)}
  function showExample(){const k=stepsFor(current().grade)[state.currentStep],info=LETTER_INFO[letterOf(k)],area=$('#hintArea');if(!area)return;if(state.settings.help!=='full'){notify('Full examples are turned off in settings');return}area.innerHTML=`<div class="hint-card" style="margin-top:11px"><h4>Example from an unrelated imaginary situation</h4><p>${esc(info.example)}</p><p style="margin-top:8px"><strong>Notice:</strong> This is a writing model, not a sentence to paste into your assignment.</p></div>`}
  function safeName(s){return (s||'writing-workshop').toLowerCase().replace(/[^a-z0-9-_]+/g,'-').slice(0,60).replace(/^-|-$/g,'')||'writing-workshop'}
  function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  async function copy(text){if(!text.trim()){notify('Write something first to copy.');return}try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{let t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();if(!document.execCommand('copy'))throw Error('Copy unavailable');t.remove()}notify('Your writing was copied. Paste it into your document.')}catch(e){notify('Copy is blocked here. Select the final response and copy it manually.')}}
  function exportFullText(d=current()){let header=[d.student?`Name: ${d.student}`:'',`Grade: ${d.grade}`,d.mode==='practice'?`Practice story: ${getStory(d)?.title||''}`:`Book: ${d.title||'Not entered'}`,d.mode==='book'&&d.author?`Author: ${d.author}`:'',d.chapter?`Chapter/pages: ${d.chapter}`:'',`Question: ${currentQuestion(d)||'Not entered'}`].filter(Boolean).join('\n');return header+'\n\n'+(outputText(d)||'[No response written yet]')+'\n'}
  function htmlDocument(d=current()){const title=esc(projectLabel(d)),question=esc(currentQuestion(d)),response=esc(outputText(d));return `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${title} — Writing Response</title><style>body{font:16px/1.7 Georgia,serif;max-width:760px;margin:60px auto;padding:0 24px;color:#273637}h1{font:700 28px system-ui,sans-serif}p.label{font:13px system-ui,sans-serif;color:#52605d}article{margin-top:28px;white-space:pre-wrap}@media print{body{margin:20px auto}}</style></head><body><h1>${title}</h1><p class="label">${esc(d.student||'Student')} • Grade ${d.grade} • ${d.grade<=6?'RACES':'RACECES'}</p><p><strong>Question:</strong> ${question}</p><article>${response.replace(/\n/g,'<br>')}</article></body></html>`}
  function startNew(){let prev=current();let n=newDraft(prev.grade);n.student=prev.student;state.drafts.push(n);state.active=n.id;state.currentStep=0;persist();go('setup');notify('New draft created')}
  function importDraft(file){if(!file)return;if(file.size>500000){notify('That file is too large for a draft backup.');return}const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(String(reader.result));if(!v||!v.answers||![5,6,7,8].includes(Number(v.grade)))throw Error('Invalid draft');let d=newDraft(Number(v.grade));for(let k of ['student','title','author','chapter','question','mode','storyId','polished','polishedSnapshot'])if(typeof v[k]==='string'||v[k]===null)d[k]=v[k];for(let k of ['R','A','C1','E1','C2','E2','S'])if(typeof v.answers[k]==='string')d.answers[k]=v.answers[k].slice(0,30000);if(!['book','practice'].includes(d.mode))d.mode='book';if(d.mode==='practice'&&!STORIES.some(s=>s.id===d.storyId))d.mode='book';state.drafts.push(d);state.active=d.id;persist();go('setup');notify('Backup imported as a new draft.')}catch(e){notify('This file is not a valid Writing Workshop draft.')}};reader.readAsText(file)}
  document.addEventListener('click',async e=>{
    const target=e.target.closest('button');if(!target)return;
    if(target.id==='brandButton'){go('setup');return}
    if(target.dataset.top){go(target.dataset.top);return}
    if(target.dataset.go){go(target.dataset.go);return}
    if(target.dataset.gradeGroup){setGradeGroup(target.dataset.gradeGroup);return}
    if(target.dataset.mode){setMode(target.dataset.mode);return}
    if(target.dataset.step!==undefined){state.currentStep=Number(target.dataset.step);go('write');return}
    if(target.dataset.story){chooseStory(target.dataset.story);return}
    if(target.dataset.reviewStep!==undefined){state.currentStep=Number(target.dataset.reviewStep);go('write');return}
    if(target.id==='surprise'){let other=STORIES.filter(s=>s.id!==current().storyId);chooseStory(other[Math.floor(Math.random()*other.length)].id);return}
    if(target.id==='togglePassage'){let p=$('#passageBox'),hidden=p.hidden;p.hidden=!hidden;target.textContent=hidden?'Hide passage ↑':'Show passage ↓';target.setAttribute('aria-expanded',String(hidden));return}
    if(target.id==='prevStep'){nextStep(-1);return}
    if(target.id==='nextStep'){nextStep(1);return}
    if(target.id==='hintButton'){showHint();return}
    if(target.id==='showExample'){showExample();return}
    if(target.id==='checkStep'){refreshWriting();notify('Writing checks refreshed. Read the suggestions at the right.');return}
    if(target.id==='rebuildFinal'){let d=current();if(d.polished&&!confirm('Replace your polished final version with the current assembled RACES sentences?'))return;d.polished=composed(d);d.polishedSnapshot=composed(d);touch();render();notify('Final editor updated from your steps');return}
    if(target.id==='copyEssay'){copy(outputText());return}
    if(target.id==='copyWithDetails'){copy(exportFullText());return}
    if(target.id==='googleDocs'){window.open('https://docs.google.com/document/u/0/','_blank','noopener,noreferrer');notify('Start a Google Doc and paste your copied writing.');return}
    if(target.id==='downloadTxt'){download(exportFullText(),safeName(projectLabel())+'-response.txt','text/plain;charset=utf-8');notify('Text file downloaded');return}
    if(target.id==='downloadHtml'){download(htmlDocument(),safeName(projectLabel())+'-response.html','text/html;charset=utf-8');notify('Printable response downloaded');return}
    if(target.id==='printEssay'){const popup=window.open('','_blank');if(!popup){notify('Pop-ups blocked. Download printable .html instead.');return}popup.document.open();popup.document.write(htmlDocument());popup.document.close();popup.focus();popup.print();return}
    if(target.id==='emailEssay'){const body=exportFullText();if(body.length>1400)notify('Long emails may be truncated by email apps. Download or copy your response instead.');const subject='ELA Writing Response — '+projectLabel();window.location.href='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body.slice(0,7000));return}
    if(target.id==='newDraft'){startNew();return}
    if(target.dataset.selectDraft){state.active=target.dataset.selectDraft;state.currentStep=0;persist();go('setup');return}
    if(target.dataset.deleteDraft){if(!confirm('Permanently delete this draft from this browser? You cannot undo this unless you downloaded a backup.'))return;state.drafts=state.drafts.filter(x=>x.id!==target.dataset.deleteDraft);if(!state.drafts.length){const d=newDraft();state.drafts=[d];state.active=d.id}else if(!state.drafts.some(x=>x.id===state.active)){state.active=state.drafts[0].id}persist();render();notify('Draft deleted');return}
    if(target.id==='backupDraft'){download(JSON.stringify(current(),null,2),safeName(projectLabel())+'-backup.json','application/json;charset=utf-8');notify('Draft backup downloaded');return}
    if(target.id==='importDraft'){$('#importInput').click();return}
    if(target.id==='clearAll'){if(!confirm('Erase EVERY saved draft in this browser? This cannot be undone.'))return;let d=newDraft();state.drafts=[d];state.active=d.id;state.currentStep=0;persist();go('setup');notify('Browser drafts cleared');return}
    if(target.dataset.quiz){if(state.quizAnswered)return;state.quizAnswered=true;state.quizChoice=target.dataset.quiz;if(state.quizChoice===QUIZ[state.quizIndex%QUIZ.length].answer)state.quizScore++;render();return}
    if(target.id==='nextQuiz'){state.quizIndex++;state.quizAnswered=false;state.quizChoice=null;render();return}
    if(target.id==='resetQuiz'){state.quizIndex=0;state.quizAnswered=false;state.quizChoice=null;state.quizScore=0;render();return}
  });
  $('#importInput').addEventListener('change',function(){if(this.files[0])importDraft(this.files[0]);this.value=''});
  window.addEventListener('beforeunload',persist);
  render();persist();
})();
</script>
</body>
</html>
